name: Go Build Only

on:
  push:
    branches: [main, diploma-submission]
  pull_request:
    branches: [main, diploma-submission]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build
      run: go build -v ./...
